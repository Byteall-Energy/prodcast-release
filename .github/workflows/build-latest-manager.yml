name: Build latest Manager

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional Manager version (vMAJOR.MINOR.PATCH); empty uses source version
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-latest-manager
  cancel-in-progress: false

jobs:
  manager:
    name: Build latest Manager EXE
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: prodcast-manager
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install locked build dependencies
        run: python -m pip install -r requirements-build.lock.txt
      - name: Resolve internal Manager version
        env:
          REQUESTED_MANAGER_VERSION: ${{ inputs.version }}
        run: |
          if ($env:REQUESTED_MANAGER_VERSION) {
            python release/manager_version.py "$env:REQUESTED_MANAGER_VERSION"
            if ($LASTEXITCODE) { throw 'Invalid requested Manager version' }
          }
          $version = python -c "from prodcast_manager import __version__; print(__version__)"
          if ($LASTEXITCODE) { throw 'Could not read Manager version' }
          "MANAGER_VERSION=$version" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test Manager
        run: ./build.ps1 -Python python -TestsOnly
      - name: Upload Manager test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-test-results
          path: prodcast-manager/.build/test-results/*.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Build and smoke-test Manager
        run: ./build.ps1 -Python python -Output dist -SkipTests
      - name: Verify and stage versioned executable
        run: |
          python release/manager_version.py "$env:MANAGER_VERSION" --verify-exe dist/ProdCast-Manager.exe
          if ($LASTEXITCODE) { throw 'Manager internal version does not match requested version' }
          Move-Item -LiteralPath dist/ProdCast-Manager.exe -Destination "dist/ProdCast-Manager-v$env:MANAGER_VERSION.exe"
      - name: Record the built source
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Could not resolve the built commit' }
          $version = python -c "from prodcast_manager import __version__; print(__version__)"
          if ($LASTEXITCODE) { throw 'Could not read Manager version' }
          $files = @(Get-ChildItem -LiteralPath dist -Filter '*.exe' -File)
          if ($files.Count -ne 1) { throw 'Expected exactly one versioned Manager executable' }
          @(
            '# Build latest Manager'
            ''
            "Manager version: $version"
            "Source commit: $commit"
            ''
            'Download the manager-latest artifact for the tested executable files.'
          ) | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Upload latest Manager executable files
        uses: actions/upload-artifact@v4
        with:
          name: manager-latest
          path: prodcast-manager/dist/ProdCast-Manager-v${{ env.MANAGER_VERSION }}.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
