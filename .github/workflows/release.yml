name: Build and assemble ProdCast release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      base_release:
        description: Optional stable offline-base tag (automatic when empty)
        required: false
        type: string
      build_only:
        description: Build and validate without creating a draft, tags, or release
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: prodcast-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  PYTHON_VERSION: '3.14.7'
  PRODCAST_RELEASE_APP_ID: ${{ secrets.PRODCAST_RELEASE_APP_ID }}

jobs:
  resolve:
    name: Freeze source snapshot
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    outputs:
      app_sha: ${{ steps.snapshot.outputs.app_sha }}
      agent_sha: ${{ steps.snapshot.outputs.agent_sha }}
      worker_sha: ${{ steps.snapshot.outputs.worker_sha }}
      ai_sha: ${{ steps.snapshot.outputs.ai_sha }}
      release_sha: ${{ steps.snapshot.outputs.release_sha }}
      base_tag: ${{ steps.snapshot.outputs.base_tag }}
      base_asset: ${{ steps.snapshot.outputs.base_asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - name: Resolve HEADs once, validate version/tags/release, and check CI
        id: snapshot
        env:
          PRODCAST_RELEASE_TOKEN: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
        run: |
          /opt/python-3.14.7/bin/python3.14 prodcast-manager/release/release_sources.py resolve \
            --version "$RELEASE_VERSION" \
            --base-tag "${{ inputs.base_release }}" \
            --output source-snapshot.json
      - name: Upload immutable source plan
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.json
          if-no-files-found: error
          retention-days: 1


  functional:
    name: App and Worker functional release gate
    needs: resolve
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: prodcast_functional
          POSTGRES_USER: prodcast_functional
          POSTGRES_PASSWORD: functional-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prodcast_functional -d prodcast_functional"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://prodcast_functional:functional-test-only@127.0.0.1:5432/prodcast_functional
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      CHANNEL_REDIS_URL: redis://127.0.0.1:6379/2
      DJANGO_DEBUG: 'true'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      PRODCAST_WORKER_SOURCE: ${{ github.workspace }}/worker
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-app,prodcast-worker
      - uses: actions/checkout@v4
        with:
          repository: Byteall-Energy/prodcast-app
          ref: ${{ needs.resolve.outputs.app_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Byteall-Energy/prodcast-worker
          ref: ${{ needs.resolve.outputs.worker_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          path: worker
          persist-credentials: false
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        shell: bash
        run: |
          python="/opt/python-$PYTHON_VERSION/bin/python3.14"
          "$python" -c 'import os, sys; assert ".".join(map(str, sys.version_info[:3])) == os.environ["PYTHON_VERSION"], sys.version'
          venv=$(mktemp -d "$RUNNER_TEMP/prodcast-python.XXXXXXXX")
          "$python" -m venv "$venv"
          printf '%s\n' "$venv/bin" >> "$GITHUB_PATH"
      - name: Install declared runtime dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -o DPkg::Lock::Timeout=300 install --yes --no-install-recommends gcc libpq-dev unixodbc-dev libkrb5-dev
          python -m pip install -r app/backend/requirements.txt
          # Worker owns its plugin and runtime dependencies; use its frozen source.
          (cd worker && python -m pip install -r requirements-worker.txt)
          python -m pip check
      - name: Test isolated Worker output bridge
        run: python -m unittest discover -s app/release -p 'test_worker_roundtrip.py' -v
      - name: Test module lifecycles and Worker round trips in both save modes
        working-directory: app/backend/mainapp
        run: |
          if ! python manage.py test apiapp.test_platform_functional apiapp.test_output_save_mode --noinput -v 2 > functional-tests.log 2>&1; then
            cat functional-tests.log
            exit 1
          fi
          tail -8 functional-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-test-report
          path: app/backend/mainapp/functional-tests.log
          if-no-files-found: warn
          retention-days: 1

  app:
    name: Build App
    needs: resolve
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - uses: actions/checkout@v4
        with:
          repository: Byteall-Energy/prodcast-app
          ref: ${{ needs.resolve.outputs.app_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        shell: bash
        run: |
          python="/opt/python-$PYTHON_VERSION/bin/python3.14"
          "$python" -c 'import os, sys; assert ".".join(map(str, sys.version_info[:3])) == os.environ["PYTHON_VERSION"], sys.version'
          venv=$(mktemp -d "$RUNNER_TEMP/prodcast-python.XXXXXXXX")
          "$python" -m venv "$venv"
          printf '%s\n' "$venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Test existing release tooling
        run: |
          python -m pip install Django==5.2.17
          python -m unittest discover -s release -p 'test_*.py'
      - name: Build App images and deployment payload
        env:
          PRODCAST_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          PRODCAST_SOURCE_REPOSITORY: Byteall-Energy/prodcast-app
          PRODCAST_PUBLISH_IMAGES: 'false'
        run: python release/build_linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: app-payload
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  agent:
    name: Build portable Agent
    needs: resolve
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - uses: actions/checkout@v4
        with:
          repository: Byteall-Energy/prodcast-agent
          ref: ${{ needs.resolve.outputs.agent_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - name: Use Python ${{ env.PYTHON_VERSION }} installed on the runner
        shell: pwsh
        run: |
          $python = 'C:\Program Files\Python314\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "Python is missing at $python"
          }
          $version = & $python --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "Python $env:PYTHON_VERSION") {
            throw "Expected Python $env:PYTHON_VERSION at $python. Got $version"
          }
          Split-Path -Parent $python |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and smoke-test portable Agent
        shell: pwsh
        env:
          PRODCAST_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          PRODCAST_SOURCE_REPOSITORY: Byteall-Energy/prodcast-agent
        run: ./release/build_windows.ps1 -Portable
      - uses: actions/upload-artifact@v4
        with:
          name: agent-payload
          path: dist/package/ProdCastAgent-v*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload internal Agent assembly metadata
        uses: actions/upload-artifact@v4
        with:
          name: agent-assembly-metadata
          path: |
            dist/package/release-manifest.json
            dist/package/SHA256SUMS
            dist/package/workflow-agent-sbom.cdx.json
            dist/package/INSTALL-RU.md
          if-no-files-found: error
          retention-days: 1

  worker:
    name: Build Worker
    needs: resolve
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - uses: actions/checkout@v4
        with:
          repository: Byteall-Energy/prodcast-worker
          ref: ${{ needs.resolve.outputs.worker_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - name: Use Python ${{ env.PYTHON_VERSION }} installed on the runner
        shell: pwsh
        run: |
          $python = 'C:\Program Files\Python314\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "Python is missing at $python"
          }
          $version = & $python --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "Python $env:PYTHON_VERSION") {
            throw "Expected Python $env:PYTHON_VERSION at $python. Got $version"
          }
          Split-Path -Parent $python |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and smoke-test Worker
        shell: pwsh
        env:
          PRODCAST_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          PRODCAST_SOURCE_REPOSITORY: Byteall-Energy/prodcast-worker
        run: ./release/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: worker-payload
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  ai:
    name: Build AI
    needs: resolve
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - uses: actions/checkout@v4
        with:
          repository: Byteall-Energy/prodcast-ai
          ref: ${{ needs.resolve.outputs.ai_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        shell: bash
        run: |
          python="/opt/python-$PYTHON_VERSION/bin/python3.14"
          "$python" -c 'import os, sys; assert ".".join(map(str, sys.version_info[:3])) == os.environ["PYTHON_VERSION"], sys.version'
          venv=$(mktemp -d "$RUNNER_TEMP/prodcast-python.XXXXXXXX")
          "$python" -m venv "$venv"
          printf '%s\n' "$venv/bin" >> "$GITHUB_PATH"
      - name: Build AI image and deployment payload
        env:
          PRODCAST_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          PRODCAST_SOURCE_REPOSITORY: Byteall-Energy/prodcast-ai
          PRODCAST_PUBLISH_IMAGES: 'false'
        run: python release/build_linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai-payload
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  manager:
    name: Build Manager
    needs: resolve
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create Manager Python 3.14.7 environment
        shell: pwsh
        run: |
          $python = 'C:\Program Files\Python314\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw "Python is missing at $python"
          }

          & $python -c "import sys; assert sys.version_info[:3] == (3, 14, 7), sys.version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $venv = Join-Path $env:RUNNER_TEMP "manager-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & $python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Join-Path $venv 'Scripts' |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install locked build dependencies
        working-directory: prodcast-manager
        run: python -m pip install -r requirements-build.lock.txt
      - name: Set internal Manager version from release input
        working-directory: prodcast-manager
        shell: pwsh
        run: python release/manager_version.py "$env:RELEASE_VERSION"
      - name: Test Manager
        working-directory: prodcast-manager
        shell: pwsh
        run: ./build.ps1 -Python python -TestsOnly
      - name: Upload Manager test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-test-results
          path: prodcast-manager/.build/test-results/*.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Build and smoke-test one-file Manager
        working-directory: prodcast-manager
        shell: pwsh
        run: ./build.ps1 -Python python -Output dist -SkipTests
      - name: Stage versioned executable
        shell: pwsh
        run: |
          python prodcast-manager/release/manager_version.py "$env:RELEASE_VERSION" --verify-exe prodcast-manager/dist/ProdCast-Manager.exe
          if ($LASTEXITCODE) { throw 'Manager internal version does not match release version' }
          Move-Item -LiteralPath prodcast-manager/dist/ProdCast-Manager.exe -Destination "prodcast-manager/dist/ProdCast-Manager-$env:RELEASE_VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: manager-payload
          path: prodcast-manager/dist/ProdCast-Manager-${{ env.RELEASE_VERSION }}.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  assemble:
    name: Assemble, validate, and publish Complete
    needs: [resolve, functional, app, agent, worker, ai, manager]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    environment: production-release
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - name: Create Python 3.14.7 environment
        shell: bash
        run: |
          python=/opt/python-3.14.7/bin/python3.14
          "$python" -c 'import sys; assert sys.version_info[:3] == (3, 14, 7), sys.version'
          venv=$(mktemp -d "$RUNNER_TEMP/prodcast-assemble.XXXXXXXX")
          "$python" -m venv "$venv"
          printf '%s\n' "$venv/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: source-snapshot
          path: dist/snapshot
      - uses: actions/download-artifact@v4
        with:
          name: app-payload
          path: dist/components/app
      - uses: actions/download-artifact@v4
        with:
          name: agent-payload
          path: dist/components/agent
      - uses: actions/download-artifact@v4
        with:
          name: agent-assembly-metadata
          path: dist/components/agent
      - uses: actions/download-artifact@v4
        with:
          name: worker-payload
          path: dist/components/worker
      - uses: actions/download-artifact@v4
        with:
          name: ai-payload
          path: dist/components/ai
      - uses: actions/download-artifact@v4
        with:
          name: manager-payload
          path: dist/components/manager
      - name: Reuse or cache the selected static/offline base
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          BASE_TAG: ${{ needs.resolve.outputs.base_tag }}
          BASE_ASSET: ${{ needs.resolve.outputs.base_asset }}
        shell: bash
        run: |
          python - <<'PY'
          import fcntl
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          
          repo = "Byteall-Energy/prodcast-release"
          tag = os.environ["BASE_TAG"]
          name = os.environ["BASE_ASSET"]
          if Path(name).name != name or name in ("", ".", ".."):
              raise SystemExit("Invalid base asset filename")
          release = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{repo}/releases/tags/{tag}"], text=True))
          asset = next(a for a in release["assets"] if a["name"] == name)
          digest = asset.get("digest")
          identity = {k: asset.get(k) for k in ("id", "size", "updated_at", "digest")}
          cache = Path.home() / ".cache/prodcast-release/bases"
          cache.mkdir(parents=True, exist_ok=True)
          archive = cache / f"{asset['id']}-{name}"
          metadata = archive.with_suffix(archive.suffix + ".json")
          
          def sha256(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return "sha256:" + h.hexdigest()
          
          def verified(path, expected):
              return path.is_file() and path.stat().st_size == asset["size"] and sha256(path) == expected
          
          with (cache / f"{asset['id']}.lock").open("w") as lock:
              fcntl.flock(lock, fcntl.LOCK_EX)
              cached = False
              if metadata.is_file():
                  saved = json.loads(metadata.read_text())
                  cached = saved.get("asset") == identity and verified(archive, digest or saved.get("sha256"))
              if not cached:
                  with tempfile.TemporaryDirectory(dir=cache) as staging:
                      staged = Path(staging) / name
                      # Adopt ZIPs left by earlier assembly/download jobs only if GitHub
                      # supplies a digest that can verify their exact contents.
                      candidates = list((cache / "completed").glob(name))
                      if digest:
                          roots = [Path("/opt/actions-runner/_work"),
                                   Path.home() / "additional-runners"]
                          for root in roots:
                              if root.exists():
                                  candidates.extend(root.glob(f"**/dist/base/{name}"))
                                  candidates.extend(root.glob(f"**/dist/assembled/{name}"))
                      local = next((p for p in candidates if verified(p, digest)), None)
                      if local:
                          print(f"Reusing verified local base: {local}", flush=True)
                          shutil.copyfile(local, staged)
                      else:
                          print(f"Downloading base {tag} once into shared cache", flush=True)
                          subprocess.run(["gh", "release", "download", tag, "--repo", repo,
                                          "--pattern", name, "--dir", staging], check=True)
                      actual = sha256(staged)
                      if staged.stat().st_size != asset["size"] or (digest and actual != digest):
                          raise SystemExit("Base archive failed size/digest verification")
                      os.replace(staged, archive)
                      temp_metadata = Path(staging) / "metadata.json"
                      temp_metadata.write_text(json.dumps({"asset": identity, "sha256": actual}))
                      os.replace(temp_metadata, metadata)
              print(f"Using shared base cache: {archive}", flush=True)
              destination = Path("dist/base") / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(archive, destination)
          PY
      - name: Assemble, checksum, and validate all provenance
        run: >-
          python prodcast-manager/release/assemble.py
          --version "$RELEASE_VERSION"
          --base-archive "dist/base/${{ needs.resolve.outputs.base_asset }}"
          --snapshot dist/snapshot/source-snapshot.json
          --app dist/components/app
          --agent dist/components/agent
          --worker dist/components/worker
          --ai dist/components/ai
          --manager-exe "dist/components/manager/ProdCast-Manager-$RELEASE_VERSION.exe"
          --output dist/assembled
      - name: Run release assembly tests
        run: |
          python -m pip install -r prodcast-manager/requirements.txt pytest==9.1.1
          python -m pytest prodcast-manager/tests/test_release_assembly.py prodcast-manager/tests/test_release_sources.py -q
      - name: Refresh publication token
        if: ${{ ! inputs.build_only && env.PRODCAST_RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        id: publish-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - name: Revalidate release and tag absence
        if: ${{ ! inputs.build_only }}
        env:
          PRODCAST_RELEASE_TOKEN: ${{ steps.publish-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
        run: python prodcast-manager/release/release_sources.py preflight --snapshot dist/snapshot/source-snapshot.json
      - name: Create draft and upload verified assets
        if: ${{ ! inputs.build_only }}
        env:
          GH_TOKEN: ${{ steps.publish-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
        run: >-
          gh release create "$RELEASE_VERSION"
          dist/assembled/*
          --repo Byteall-Energy/prodcast-release
          --target "${{ needs.resolve.outputs.release_sha }}"
          --title "ProdCast $RELEASE_VERSION"
          --notes-file dist/assembled/RELEASE-NOTES.md
          --draft
      - name: Recheck and create immutable tags in every repository
        if: ${{ ! inputs.build_only }}
        env:
          PRODCAST_RELEASE_TOKEN: ${{ steps.publish-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
        run: python prodcast-manager/release/release_sources.py create-tags --snapshot dist/snapshot/source-snapshot.json
      - name: Publish only after every tag is verified
        if: ${{ ! inputs.build_only }}
        env:
          GH_TOKEN: ${{ steps.publish-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
        run: gh release edit "$RELEASE_VERSION" --repo Byteall-Energy/prodcast-release --draft=false
      - name: Write release summary
        if: ${{ ! inputs.build_only }}
        env:
          BASE_TAG: ${{ needs.resolve.outputs.base_tag }}
        run: python prodcast-manager/release/write_summary.py dist/snapshot/source-snapshot.json dist/assembled "$GITHUB_STEP_SUMMARY" published

      - name: Retain Complete archive on this VM
        shell: bash
        run: |
          cache="$HOME/.cache/prodcast-release/bases/completed"
          mkdir -p "$cache"
          archive="dist/assembled/ProdCast-$RELEASE_VERSION-complete.zip"
          test -f "$archive"
          staging=$(mktemp "$cache/.complete.XXXXXXXX")
          cp "$archive" "$staging"
          mv "$staging" "$cache/ProdCast-$RELEASE_VERSION-complete.zip"

      - name: Write build-only summary
        if: ${{ inputs.build_only }}
        env:
          BASE_TAG: ${{ needs.resolve.outputs.base_tag }}
        run: python prodcast-manager/release/write_summary.py dist/snapshot/source-snapshot.json dist/assembled "$GITHUB_STEP_SUMMARY" build-only

      - name: Keep build-only assets available for download
        if: ${{ inputs.build_only }}
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-assets
          path: dist/assembled/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
