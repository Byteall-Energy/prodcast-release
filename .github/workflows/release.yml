name: Build and assemble ProdCast release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      base_release:
        description: Optional stable offline-base tag (automatic when empty)
        required: false
        type: string
      build_only:
        description: Build and validate without creating a draft, tags, or release
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: prodcast-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  PYTHON_VERSION: '3.14.7'
  PRODCAST_RELEASE_APP_ID: ${{ secrets.PRODCAST_RELEASE_APP_ID }}

jobs:
  resolve:
    name: Freeze source snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      app_sha: ${{ steps.snapshot.outputs.app_sha }}
      agent_sha: ${{ steps.snapshot.outputs.agent_sha }}
      worker_sha: ${{ steps.snapshot.outputs.worker_sha }}
      ai_sha: ${{ steps.snapshot.outputs.ai_sha }}
      release_sha: ${{ steps.snapshot.outputs.release_sha }}
      base_tag: ${{ steps.snapshot.outputs.base_tag }}
      base_asset: ${{ steps.snapshot.outputs.base_asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - name: Resolve HEADs once, validate version/tags/release, and check CI
        id: snapshot
        env:
          PRODCAST_RELEASE_TOKEN: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
        run: >-
          python prodcast-manager/release/release_sources.py resolve
          --version "$RELEASE_VERSION"
          --base-tag "${{ inputs.base_release }}"
          --output source-snapshot.json
      - name: Upload immutable source plan
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.json
          if-no-files-found: error
          retention-days: 1


  functional:
    name: App and Worker functional release gate
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: prodcast_functional
          POSTGRES_USER: prodcast_functional
          POSTGRES_PASSWORD: functional-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prodcast_functional -d prodcast_functional"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://prodcast_functional:functional-test-only@127.0.0.1:5432/prodcast_functional
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      CHANNEL_REDIS_URL: redis://127.0.0.1:6379/2
      DJANGO_DEBUG: 'true'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      PRODCAST_WORKER_SOURCE: ${{ github.workspace }}/worker
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-app,prodcast-worker
      - uses: actions/checkout@v4
        with:
          repository: Byteall-Energy/prodcast-app
          ref: ${{ needs.resolve.outputs.app_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Byteall-Energy/prodcast-worker
          ref: ${{ needs.resolve.outputs.worker_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          path: worker
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install declared runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc libpq-dev unixodbc-dev
          python -m pip install -r app/backend/requirements.txt
          # Worker owns its plugin and runtime dependencies; use its frozen source.
          (cd worker && python -m pip install -r requirements-worker.txt)
          python -m pip check
      - name: Test isolated Worker output bridge
        run: python -m unittest discover -s app/release -p 'test_worker_roundtrip.py' -v
      - name: Test module lifecycles and Worker round trips in both save modes
        working-directory: app/backend/mainapp
        run: |
          if ! python manage.py test apiapp.test_platform_functional apiapp.test_output_save_mode --noinput -v 2 > functional-tests.log 2>&1; then
            cat functional-tests.log
            exit 1
          fi
          tail -8 functional-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-test-report
          path: app/backend/mainapp/functional-tests.log
          if-no-files-found: warn
          retention-days: 1

  app:
    name: Build App
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - uses: actions/checkout@v4
        with:
          repository: Byteall-Energy/prodcast-app
          ref: ${{ needs.resolve.outputs.app_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Test existing release tooling
        run: |
          python -m pip install Django==5.2.17
          python -m unittest discover -s release -p 'test_*.py'
      - name: Build App images and deployment payload
        env:
          PRODCAST_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          PRODCAST_SOURCE_REPOSITORY: Byteall-Energy/prodcast-app
          PRODCAST_PUBLISH_IMAGES: 'false'
        run: python release/build_linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: app-payload
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  agent:
    name: Build portable Agent
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - uses: actions/checkout@v4
        with:
          repository: Byteall-Energy/prodcast-agent
          ref: ${{ needs.resolve.outputs.agent_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build and smoke-test portable Agent
        shell: pwsh
        env:
          PRODCAST_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          PRODCAST_SOURCE_REPOSITORY: Byteall-Energy/prodcast-agent
        run: ./release/build_windows.ps1 -Portable
      - uses: actions/upload-artifact@v4
        with:
          name: agent-payload
          path: dist/package/ProdCastAgent-v*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload internal Agent assembly metadata
        uses: actions/upload-artifact@v4
        with:
          name: agent-assembly-metadata
          path: |
            dist/package/release-manifest.json
            dist/package/SHA256SUMS
            dist/package/workflow-agent-sbom.cdx.json
            dist/package/INSTALL-RU.md
          if-no-files-found: error
          retention-days: 1

  worker:
    name: Build Worker
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - uses: actions/checkout@v4
        with:
          repository: Byteall-Energy/prodcast-worker
          ref: ${{ needs.resolve.outputs.worker_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build and smoke-test Worker
        shell: pwsh
        env:
          PRODCAST_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          PRODCAST_SOURCE_REPOSITORY: Byteall-Energy/prodcast-worker
        run: ./release/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: worker-payload
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  ai:
    name: Build AI
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - uses: actions/checkout@v4
        with:
          repository: Byteall-Energy/prodcast-ai
          ref: ${{ needs.resolve.outputs.ai_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build AI image and deployment payload
        env:
          PRODCAST_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          PRODCAST_SOURCE_REPOSITORY: Byteall-Energy/prodcast-ai
          PRODCAST_PUBLISH_IMAGES: 'false'
        run: python release/build_linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai-payload
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  manager:
    name: Build Manager
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install locked build dependencies
        working-directory: prodcast-manager
        run: python -m pip install -r requirements-build.lock.txt
      - name: Set internal Manager version from release input
        working-directory: prodcast-manager
        shell: pwsh
        run: python release/manager_version.py "$env:RELEASE_VERSION"
      - name: Test Manager
        working-directory: prodcast-manager
        shell: pwsh
        run: ./build.ps1 -Python python -TestsOnly
      - name: Upload Manager test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-test-results
          path: prodcast-manager/.build/test-results/*.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Build and smoke-test one-file Manager
        working-directory: prodcast-manager
        shell: pwsh
        run: ./build.ps1 -Python python -Output dist -SkipTests
      - name: Stage versioned executable
        shell: pwsh
        run: |
          python prodcast-manager/release/manager_version.py "$env:RELEASE_VERSION" --verify-exe prodcast-manager/dist/ProdCast-Manager.exe
          if ($LASTEXITCODE) { throw 'Manager internal version does not match release version' }
          Move-Item -LiteralPath prodcast-manager/dist/ProdCast-Manager.exe -Destination "prodcast-manager/dist/ProdCast-Manager-$env:RELEASE_VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: manager-payload
          path: prodcast-manager/dist/ProdCast-Manager-${{ env.RELEASE_VERSION }}.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  assemble:
    name: Assemble and validate Complete
    needs: [resolve, functional, app, agent, worker, ai, manager]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: source-snapshot
          path: dist/snapshot
      - uses: actions/download-artifact@v4
        with:
          name: app-payload
          path: dist/components/app
      - uses: actions/download-artifact@v4
        with:
          name: agent-payload
          path: dist/components/agent
      - uses: actions/download-artifact@v4
        with:
          name: agent-assembly-metadata
          path: dist/components/agent
      - uses: actions/download-artifact@v4
        with:
          name: worker-payload
          path: dist/components/worker
      - uses: actions/download-artifact@v4
        with:
          name: ai-payload
          path: dist/components/ai
      - uses: actions/download-artifact@v4
        with:
          name: manager-payload
          path: dist/components/manager
      - name: Download the selected static/offline base
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
        run: >-
          gh release download "${{ needs.resolve.outputs.base_tag }}"
          --repo Byteall-Energy/prodcast-release
          --pattern "${{ needs.resolve.outputs.base_asset }}"
          --dir dist/base
      - name: Assemble, checksum, and validate all provenance
        run: >-
          python prodcast-manager/release/assemble.py
          --version "$RELEASE_VERSION"
          --base-archive "dist/base/${{ needs.resolve.outputs.base_asset }}"
          --snapshot dist/snapshot/source-snapshot.json
          --app dist/components/app
          --agent dist/components/agent
          --worker dist/components/worker
          --ai dist/components/ai
          --manager-exe "dist/components/manager/ProdCast-Manager-$RELEASE_VERSION.exe"
          --output dist/assembled
      - name: Run release assembly tests
        run: |
          python -m pip install -r prodcast-manager/requirements.txt pytest==9.1.1
          python -m pytest prodcast-manager/tests/test_release_assembly.py prodcast-manager/tests/test_release_sources.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-assets
          path: dist/assembled/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Draft, tag snapshot, and publish
    if: ${{ ! inputs.build_only }}
    needs: [resolve, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-release
    steps:
      - uses: actions/create-github-app-token@v2
        if: env.PRODCAST_RELEASE_APP_ID != ''
        id: release-token
        with:
          app-id: ${{ env.PRODCAST_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODCAST_RELEASE_APP_PRIVATE_KEY }}
          owner: Byteall-Energy
          repositories: prodcast-release,prodcast-app,prodcast-agent,prodcast-worker,prodcast-ai
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          token: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: source-snapshot
          path: dist/snapshot
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-assets
          path: dist/assembled
      - name: Revalidate release and tag absence
        env:
          PRODCAST_RELEASE_TOKEN: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
        run: python prodcast-manager/release/release_sources.py preflight --snapshot dist/snapshot/source-snapshot.json
      - name: Create draft and upload verified assets
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
        run: >-
          gh release create "$RELEASE_VERSION"
          dist/assembled/*
          --repo Byteall-Energy/prodcast-release
          --target "${{ needs.resolve.outputs.release_sha }}"
          --title "ProdCast $RELEASE_VERSION"
          --notes-file dist/assembled/RELEASE-NOTES.md
          --draft
      - name: Recheck and create immutable tags in every repository
        env:
          PRODCAST_RELEASE_TOKEN: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
        run: python prodcast-manager/release/release_sources.py create-tags --snapshot dist/snapshot/source-snapshot.json
      - name: Publish only after every tag is verified
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token || secrets.PRODCAST_RELEASE_TOKEN }}
        run: gh release edit "$RELEASE_VERSION" --repo Byteall-Energy/prodcast-release --draft=false
      - name: Write release summary
        env:
          BASE_TAG: ${{ needs.resolve.outputs.base_tag }}
        run: python prodcast-manager/release/write_summary.py dist/snapshot/source-snapshot.json dist/assembled "$GITHUB_STEP_SUMMARY" published

  build-only-summary:
    name: Build-only summary
    if: ${{ inputs.build_only }}
    needs: [resolve, assemble]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: source-snapshot
          path: dist/snapshot
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-assets
          path: dist/assembled
      - run: python prodcast-manager/release/write_summary.py dist/snapshot/source-snapshot.json dist/assembled "$GITHUB_STEP_SUMMARY" build-only
